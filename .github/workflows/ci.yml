name: CI Pipeline Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    name: Code & Transformation Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff (Python Linting & Formatting)
        run: |
          ruff check ingestion/ tests/ mcp_server/ pipeline_runner.py
          ruff format --check ingestion/ tests/ mcp_server/ pipeline_runner.py

      - name: Run SQLFluff (dbt SQL Linting)
        run: |
          sqlfluff lint transform_dbt/models/

      - name: Install dbt Dependencies & Parse Manifest
        run: |
          dbt deps --project-dir transform_dbt --profiles-dir transform_dbt
          dbt parse --project-dir transform_dbt --profiles-dir transform_dbt

      - name: Run Pytest (Unit & End-to-End Tests)
        run: |
          pytest tests/ -v
